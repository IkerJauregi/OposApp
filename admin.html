<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel admin | Simulador OPE Euskadi</title>
    <meta
      name="description"
      content="Panel de administración para revisar, corregir y publicar preguntas del simulador."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Manrope", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Sora", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              ink: "#132238",
              tide: "#158c8b",
              glow: "#f59e0b",
              coral: "#ef7d57",
              mist: "#eef6f7",
              cloud: "#f8fafc",
            },
            boxShadow: {
              soft: "0 24px 80px rgba(19, 34, 56, 0.12)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background:
          radial-gradient(circle at top left, rgba(21, 140, 139, 0.18), transparent 32%),
          radial-gradient(circle at top right, rgba(245, 158, 11, 0.18), transparent 30%),
          linear-gradient(180deg, #f8fbfc 0%, #eef4f7 52%, #fff6ee 100%);
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(16px);
      }
    </style>
  </head>
  <body class="min-h-screen text-ink antialiased">
    <main class="mx-auto min-h-screen max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <div id="admin-app"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-shared.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
